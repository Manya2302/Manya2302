<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <style>
    .bg { fill: #050505; }
    .box { fill: none; stroke: #333; stroke-width: 1; rx: 4; }
    .box-active { fill: rgba(0, 240, 255, 0.05); stroke: #00F0FF; stroke-width: 1.5; rx: 4; animation: borderPulse 2s infinite; }
    @keyframes borderPulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.3; } }
    .title { fill: #E0E0E0; font-family: monospace; font-size: 14px; font-weight: bold; }
    .sub { fill: #888; font-family: monospace; font-size: 10px; }
    .status-ok { fill: #00FF66; }
    .status-busy { fill: #B026FF; }
    .heartbeat { fill: none; stroke: #00FF66; stroke-width: 1.5; animation: beat 3s infinite linear; stroke-dasharray: 100; stroke-dashoffset: 100; }
    @keyframes beat { to { stroke-dashoffset: -100; } }
  </style>
  <rect width="800" height="250" class="bg" />
  
  <!-- Agent 1 -->
  <rect x="50" y="50" width="200" height="150" class="box-active" />
  <text x="70" y="80" class="title">COORDINATOR</text>
  <text x="70" y="100" class="sub">STATUS: <tspan class="status-ok">ONLINE</tspan></text>
  <text x="70" y="120" class="sub">LOAD: 42%</text>
  <path d="M 70 160 L 90 160 L 100 140 L 110 180 L 120 160 L 150 160" class="heartbeat" />
  
  <!-- Agent 2 -->
  <rect x="300" y="50" width="200" height="150" class="box" />
  <text x="320" y="80" class="title">RESEARCHER</text>
  <text x="320" y="100" class="sub">STATUS: <tspan class="status-busy">ANALYZING</tspan></text>
  <text x="320" y="120" class="sub">LOAD: 89%</text>
  <path d="M 320 160 L 340 160 L 350 130 L 360 190 L 370 160 L 400 160" class="heartbeat" style="stroke: #B026FF; animation-duration: 1.5s;" />
  
  <!-- Agent 3 -->
  <rect x="550" y="50" width="200" height="150" class="box" />
  <text x="570" y="80" class="title">CODER</text>
  <text x="570" y="100" class="sub">STATUS: <tspan class="status-ok">IDLE</tspan></text>
  <text x="570" y="120" class="sub">LOAD: 5%</text>
  <line x1="570" y1="160" x2="650" y2="160" class="heartbeat" style="animation: none; stroke-dasharray: 0;" />
</svg>
