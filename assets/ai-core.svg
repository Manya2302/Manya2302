<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <style>
    .bg { fill: #050505; }
    .spin-slow { animation: spin 20s linear infinite; transform-origin: center; }
    .spin-fast { animation: spin-reverse 10s linear infinite; transform-origin: center; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 10px #00F0FF); opacity: 0.8; } 50% { filter: drop-shadow(0 0 25px #00F0FF); opacity: 1; } }
    .glow { filter: drop-shadow(0 0 8px #B026FF); }
  </style>
  <rect width="800" height="300" class="bg" />
  <g transform="translate(400, 150)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#B026FF" stroke-width="2" stroke-dasharray="20 10 5 10" class="spin-slow glow" />
    <!-- Middle Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00FF66" stroke-width="3" stroke-dasharray="30 15 10 15" class="spin-fast" />
    <!-- Inner Core -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="5" stroke-dasharray="10 5" class="spin-slow" />
    <circle cx="0" cy="0" r="30" fill="#00F0FF" class="pulse" />
    <!-- Lines -->
    <line x1="-150" y1="0" x2="-130" y2="0" stroke="#00F0FF" stroke-width="2" />
    <line x1="130" y1="0" x2="150" y2="0" stroke="#00F0FF" stroke-width="2" />
    <line x1="0" y1="-150" x2="0" y2="-130" stroke="#00F0FF" stroke-width="2" />
    <line x1="0" y1="130" x2="0" y2="150" stroke="#00F0FF" stroke-width="2" />
    <text x="0" y="5" font-family="Courier" font-size="12" fill="#050505" font-weight="bold" text-anchor="middle">AI</text>
  </g>
</svg>
