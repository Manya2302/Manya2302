<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <style>
    .bg { fill: #050505; }
    .grid { stroke: #111; stroke-width: 1; }
    .glow { fill: radial-gradient(circle, rgba(0,240,255,0.1) 0%, rgba(5,5,5,0) 70%); }
  </style>
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" class="bg" />
  <rect width="1920" height="1080" fill="url(#gridPattern)" />
  <rect width="1920" height="1080" fill="url(#glowGrad)" />
</svg>
