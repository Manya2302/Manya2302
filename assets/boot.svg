<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <style>
    @keyframes typing {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #00FF66; font-weight: bold; opacity: 0; }
    .line1 { animation: typing 0.1s forwards 0.5s; }
    .line2 { animation: typing 0.1s forwards 1.2s; }
    .line3 { animation: typing 0.1s forwards 2.0s; }
    .line4 { animation: typing 0.1s forwards 2.8s; }
    .line5 { animation: typing 0.1s forwards 3.6s; fill: #00F0FF; font-size: 16px; }
    .cursor { animation: blink 1s infinite; fill: #00FF66; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .bg { fill: #050505; }
  </style>
  <rect width="800" height="200" class="bg" />
  <text x="40" y="40" class="text line1"> > INITIALIZING MANYA AI CORE...</text>
  <text x="40" y="70" class="text line2"> > LOADING NEURAL NETWORK PARAMETERS...</text>
  <text x="40" y="100" class="text line3"> > CONNECTING TO QUANTUM CLUSTER...</text>
  <text x="40" y="130" class="text line4"> > BYPASSING SECURITY PROTOCOLS...</text>
  <text x="40" y="160" class="text line5"> > ACCESS GRANTED. SYSTEM ONLINE.</text>
  <rect x="350" y="148" width="10" height="15" class="cursor" style="animation-delay: 3.6s; opacity: 0;" />
</svg>
