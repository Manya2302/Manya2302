<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <style>
    .bg { fill: #050505; }
    
    .brain-outline { fill: none; stroke: #00F0FF; stroke-width: 2; opacity: 0.3; }
    .brain-core { fill: rgba(0, 240, 255, 0.05); }
    
    .neural-path { fill: none; stroke: #B026FF; stroke-width: 1.5; stroke-dasharray: 20 40; animation: trace 3s linear infinite; }
    .neural-path-fast { fill: none; stroke: #00FF66; stroke-width: 2; stroke-dasharray: 10 50; animation: trace 1.5s linear infinite reverse; }
    @keyframes trace { to { stroke-dashoffset: -120; } }
    
    .node { fill: #00F0FF; animation: pulse 2s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.5); filter: drop-shadow(0 0 5px #00F0FF); } }

    .grid { stroke: #333; stroke-width: 1; stroke-dasharray: 2 10; }
  </style>
  <rect width="800" height="400" class="bg" />
  
  <g transform="translate(400, 200)">
    <!-- Decorative Grid Background behind the brain -->
    <path d="M-200,0 L200,0 M0,-150 L0,150" class="grid" />
    <circle cx="0" cy="0" r="120" class="grid" fill="none" />
    
    <!-- Realistic Brain Side Profile Silhouette (Front is right side) -->
    <!-- Frontal Lobe (Right), Parietal (Top), Occipital (Left), Cerebellum (Bottom Left), Brainstem (Bottom Center) -->
    <path class="brain-core" d="M100,-20 C120,-60 90,-110 40,-130 C-10,-150 -70,-130 -110,-90 C-150,-50 -140,-10 -130,20 C-140,50 -120,90 -90,110 C-60,130 -20,110 0,90 C10,130 50,140 70,110 C90,80 110,30 100,-20 Z" />
    <path class="brain-outline" d="M100,-20 C120,-60 90,-110 40,-130 C-10,-150 -70,-130 -110,-90 C-150,-50 -140,-10 -130,20 C-140,50 -120,90 -90,110 C-60,130 -20,110 0,90 C10,130 50,140 70,110 C90,80 110,30 100,-20 Z" />
    
    <!-- Sulci / Folds (Internal curved paths) -->
    <g opacity="0.6">
      <path class="brain-outline" d="M40,-130 C30,-80 50,-40 80,-10" />
      <path class="brain-outline" d="M-10,-140 C-20,-80 -10,-20 30,20" />
      <path class="brain-outline" d="M-60,-120 C-50,-70 -80,-30 -40,10" />
      <path class="brain-outline" d="M-110,-90 C-80,-60 -110,-20 -70,30" />
      <path class="brain-outline" d="M-130,20 C-90,0 -80,40 -40,60" />
    </g>
    
    <!-- Neural Pathways overlay -->
    <path class="neural-path" d="M-100,-80 Q-50,-100 0,-50 T80,0 T50,80" />
    <path class="neural-path" style="stroke: #00F0FF; animation-delay: 0.5s;" d="M-130,0 Q-80,-20 -40,30 T20,80" />
    <path class="neural-path-fast" d="M20,-120 Q30,-60 0,0 T-60,60" />
    <path class="neural-path-fast" style="stroke: #00F0FF; animation-delay: 1s;" d="M80,-30 Q40,-10 0,40 T-80,80" />
    
    <!-- Firing Synapse Nodes -->
    <circle cx="-100" cy="-80" r="3" class="node" style="animation-delay: 0s" />
    <circle cx="-50" cy="-75" r="3" class="node" style="animation-delay: 0.4s" />
    <circle cx="0" cy="-50" r="4" class="node" style="animation-delay: 0.8s" />
    <circle cx="40" cy="-25" r="3" class="node" style="animation-delay: 1.2s" />
    <circle cx="80" cy="0" r="4" class="node" style="animation-delay: 1.6s" />
    
    <circle cx="-130" cy="0" r="3" class="node" style="animation-delay: 0.2s" />
    <circle cx="-85" cy="5" r="4" class="node" style="animation-delay: 0.6s" />
    <circle cx="-40" cy="30" r="3" class="node" style="animation-delay: 1.0s" />
    <circle cx="-10" cy="55" r="4" class="node" style="animation-delay: 1.4s" />
    <circle cx="20" cy="80" r="3" class="node" style="animation-delay: 1.8s" />
    
    <!-- Cerebellum detail -->
    <path d="M-110,80 C-100,60 -70,50 -50,70 C-30,90 -50,120 -80,110 C-100,100 -120,100 -110,80 Z" fill="none" stroke="#B026FF" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.7" />
    <text x="-40" y="-150" fill="#00F0FF" font-family="monospace" font-size="12" letter-spacing="2">COGNITIVE_ENGINE // ONLINE</text>
  </g>
</svg>
