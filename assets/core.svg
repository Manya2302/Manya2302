<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <style>
    .bg { fill: #050505; }
    
    .spin { animation: spin 20s linear infinite; transform-origin: center; }
    .spin-rev { animation: spin-rev 15s linear infinite; transform-origin: center; }
    .spin-fast { animation: spin 5s linear infinite; transform-origin: center; }
    .spin-fast-rev { animation: spin-rev 8s linear infinite; transform-origin: center; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    
    .pulse { animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes pulse { 
      0% { opacity: 0.4; filter: drop-shadow(0 0 10px #00F0FF); } 
      100% { opacity: 1; filter: drop-shadow(0 0 40px #00F0FF) drop-shadow(0 0 20px #FFF); } 
    }
    
    .lightning { fill: none; stroke: #00F0FF; stroke-width: 2; animation: flash 0.5s infinite; opacity: 0; }
    @keyframes flash { 0%, 90% { opacity: 0; } 92%, 98% { opacity: 1; filter: drop-shadow(0 0 10px #00F0FF); } 100% { opacity: 0; } }
    
    .glitch-ring { fill: none; stroke: #B026FF; stroke-width: 3; animation: ringGlitch 3s infinite; }
    @keyframes ringGlitch { 
      0%, 95% { stroke-dasharray: 200 50; stroke-width: 3; transform: scale(1); } 
      96%, 98% { stroke-dasharray: 10 50; stroke-width: 10; transform: scale(1.05); } 
      100% { stroke-dasharray: 200 50; stroke-width: 3; transform: scale(1); }
    }
  </style>
  <rect width="800" height="400" class="bg" />
  
  <g transform="translate(400, 200)">
    
    <!-- Outer Mechanical Shell -->
    <g class="spin-rev">
      <circle cx="0" cy="0" r="185" fill="none" stroke="#111" stroke-width="10" stroke-dasharray="20 40" />
      <circle cx="0" cy="0" r="175" fill="none" stroke="#333" stroke-width="2" />
      <path d="M 0 -175 L 10 -195 L -10 -195 Z" fill="#00F0FF" />
      <path d="M 0 175 L 10 195 L -10 195 Z" fill="#00F0FF" />
      <path d="M 175 0 L 195 10 L 195 -10 Z" fill="#00F0FF" />
      <path d="M -175 0 L -195 10 L -195 -10 Z" fill="#00F0FF" />
    </g>
    
    <!-- Heavy Glowing Rings -->
    <circle cx="0" cy="0" r="160" class="glitch-ring" />
    <circle cx="0" cy="0" r="150" fill="none" stroke="#00F0FF" stroke-width="6" stroke-dasharray="10 50 100 20" class="spin" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#00FF66" stroke-width="2" stroke-dasharray="4 8" class="spin-fast" />
    
    <!-- Complex Geometry -->
    <g class="spin">
      <!-- Hexagram -->
      <polygon points="0,-120 103,-60 103,60 0,120 -103,60 -103,-60" fill="rgba(0, 240, 255, 0.05)" stroke="#00F0FF" stroke-width="1" />
      <polygon points="0,120 -103,-60 103,-60" fill="rgba(176, 38, 255, 0.1)" stroke="#B026FF" stroke-width="2" />
      <polygon points="0,-120 103,60 -103,60" fill="rgba(0, 255, 102, 0.1)" stroke="#00FF66" stroke-width="2" />
    </g>
    
    <g class="spin-rev">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="2 10" />
      <!-- Octagon -->
      <polygon points="30,-72 72,-30 72,30 30,72 -30,72 -72,30 -72,-30 -30,-72" fill="none" stroke="#00F0FF" stroke-width="2" />
    </g>
    
    <!-- Inner High Energy Cores -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#B026FF" stroke-width="10" stroke-dasharray="15 30" class="spin-fast-rev" />
    <circle cx="0" cy="0" r="50" fill="rgba(0, 240, 255, 0.2)" stroke="#00F0FF" stroke-width="4" stroke-dasharray="60 40" class="spin-fast" />
    
    <!-- Lightning Arcs from Center -->
    <path class="lightning" d="M 0 0 L 20 -40 L 10 -70 L 40 -110" style="animation-delay: 0.1s;" />
    <path class="lightning" d="M 0 0 L -30 20 L -10 60 L -60 100" style="animation-delay: 0.3s;" />
    <path class="lightning" d="M 0 0 L 40 10 L 60 50 L 120 40" style="animation-delay: 0.6s;" />
    <path class="lightning" d="M 0 0 L -20 -30 L -50 -20 L -90 -60" style="animation-delay: 0.8s;" />
    
    <!-- Absolute Center Pulse -->
    <circle cx="0" cy="0" r="30" fill="#00F0FF" class="pulse" />
    <circle cx="0" cy="0" r="15" fill="#FFF" class="pulse" style="animation-duration: 1s;" />
  </g>
</svg>
