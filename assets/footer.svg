<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150">
  <style>
    .bg { fill: #050505; }
    .btn { fill: #111; stroke: #FF003C; stroke-width: 2; cursor: pointer; }
    .btn:hover { fill: #FF003C; }
    .btn-text { font-family: monospace; font-size: 16px; font-weight: bold; fill: #FF003C; pointer-events: none; }
    .btn:hover + .btn-text { fill: #111; }
    .glow { animation: red-glow 2s infinite alternate; }
    @keyframes red-glow { 0% { filter: drop-shadow(0 0 2px #FF003C); } 100% { filter: drop-shadow(0 0 15px #FF003C); } }
  </style>
  <rect width="800" height="150" class="bg" />
  
  <g transform="translate(300, 50)" class="glow">
    <rect x="0" y="0" width="200" height="50" rx="5" class="btn" />
    <text x="100" y="30" class="btn-text" text-anchor="middle">SYSTEM SHUTDOWN</text>
  </g>
</svg>
