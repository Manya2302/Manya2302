<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <style>
    .bg { fill: #050505; }
    .conn { fill: none; stroke: #333; stroke-width: 1.5; }
    .conn-active { fill: none; stroke: #00F0FF; stroke-width: 2; opacity: 0.7; stroke-dasharray: 10 20; animation: flow 2s linear infinite; }
    .conn-alt { fill: none; stroke: #B026FF; stroke-width: 2; opacity: 0.7; stroke-dasharray: 5 15; animation: flow-rev 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    @keyframes flow-rev { to { stroke-dashoffset: 20; } }
    .node-hub { fill: #050505; stroke: #00FF66; stroke-width: 3; filter: drop-shadow(0 0 10px #00FF66); animation: pulseHub 3s infinite alternate; }
    .node-sub { fill: #00F0FF; }
    @keyframes pulseHub { 0% { r: 12; } 100% { r: 16; } }
    .label { fill: #888; font-family: monospace; font-size: 10px; }
  </style>
  <rect width="800" height="300" class="bg" />
  
  <g transform="translate(0, 20)">
    <!-- Connections -->
    <path class="conn" d="M 400 150 C 300 50, 200 150, 150 100" />
    <path class="conn-active" d="M 400 150 C 300 50, 200 150, 150 100" />
    
    <path class="conn" d="M 400 150 C 500 250, 600 50, 650 120" />
    <path class="conn-alt" d="M 400 150 C 500 250, 600 50, 650 120" />
    
    <path class="conn" d="M 150 100 C 100 50, 50 150, 80 200" />
    <path class="conn-active" d="M 150 100 C 100 50, 50 150, 80 200" />
    
    <path class="conn" d="M 650 120 C 700 200, 750 100, 720 50" />
    
    <path class="conn" d="M 400 150 C 450 50, 250 50, 300 250" />
    <path class="conn-alt" d="M 400 150 C 450 50, 250 50, 300 250" />
    
    <!-- Nodes -->
    <circle cx="400" cy="150" r="12" class="node-hub" />
    <text x="400" y="120" class="label" fill="#00FF66" text-anchor="middle">GLOBAL_ONTOLOGY</text>
    
    <circle cx="150" cy="100" r="8" class="node-sub" />
    <text x="150" y="80" class="label" text-anchor="middle">NLP_ENGINE</text>
    
    <circle cx="650" cy="120" r="8" class="node-sub" style="fill: #B026FF;" />
    <text x="650" y="100" class="label" text-anchor="middle">ML_INFERENCE</text>
    
    <circle cx="80" cy="200" r="6" class="node-sub" />
    <circle cx="720" cy="50" r="6" class="node-sub" style="fill: #B026FF;" />
    <circle cx="300" cy="250" r="6" class="node-sub" style="fill: #00FF66;" />
  </g>
</svg>
