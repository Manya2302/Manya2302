<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <style>
    .bg { fill: #050505; }
    
    .shake { animation: shake 12s infinite; transform-origin: center; }
    @keyframes shake {
      0%, 39% { transform: translate(0, 0); }
      40%, 60% { transform: translate(2px, -2px); }
      41%, 59% { transform: translate(-2px, 2px); }
      42%, 58% { transform: translate(3px, 1px); }
      43%, 57% { transform: translate(-3px, -1px); }
      61%, 100% { transform: translate(0, 0); }
    }

    .hero-container { animation: fly 12s infinite ease-in-out; transform-origin: center; }
    @keyframes fly {
      0% { transform: translate(-200px, 120px); }
      15%, 75% { transform: translate(200px, 120px); }
      85%, 100% { transform: translate(1200px, 120px); }
    }
    
    .hover { animation: hover 3s infinite ease-in-out; }
    @keyframes hover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .cape { animation: flutter 0.15s infinite alternate; transform-origin: top center; }
    @keyframes flutter {
      from { transform: skewX(-2deg) scaleY(1); }
      to { transform: skewX(8deg) scaleY(1.02); }
    }

    .eye { fill: #050505; animation: eyeGlow 12s infinite; }
    @keyframes eyeGlow {
      0%, 33% { fill: #050505; filter: drop-shadow(0 0 0px #FF0000); }
      34%, 63% { fill: #FFF; filter: drop-shadow(0 0 15px #FF0000); }
      64%, 100% { fill: #050505; filter: drop-shadow(0 0 0px #FF0000); }
    }
    
    .laser-beam { opacity: 0; transform-origin: 0 4px; animation: fireLaser 12s infinite; }
    @keyframes fireLaser {
      0%, 37% { opacity: 0; transform: scaleX(0) rotate(5deg); }
      38%, 42% { opacity: 1; transform: scaleX(1) rotate(15deg); }
      45%, 55% { opacity: 1; transform: scaleX(1) rotate(-5deg); }
      58%, 62% { opacity: 1; transform: scaleX(1) rotate(10deg); }
      63%, 100% { opacity: 0; transform: scaleX(0) rotate(5deg); }
    }
    
    .grid { stroke: #333; stroke-width: 1; stroke-dasharray: 4 10; opacity: 0.5; }
    
    /* Suit Colors */
    .suit-blue { fill: #0a3d91; }
    .suit-gold { fill: #d4af37; }
    .suit-red { fill: #990000; }
    .skin { fill: #ffcc99; }
    .hair { fill: #e5c158; }
  </style>
  
  <rect width="1000" height="300" class="bg" />
  <line x1="0" y1="280" x2="1000" y2="280" class="grid" />
  <line x1="0" y1="260" x2="1000" y2="260" class="grid" />
  
  <g class="shake">
    <g class="hero-container">
      <g class="hover" transform="scale(0.8)">
        
        <!-- Cape Back -->
        <path class="cape suit-red" d="M -15 20 Q -80 80 -40 180 Q -10 160 15 20 Z" />
        <path class="cape suit-red" d="M -15 20 Q -60 100 10 180 Q 30 140 15 20 Z" style="fill: #770000;" />
        
        <!-- Body Base -->
        <path class="suit-blue" d="M -18 20 L 18 20 L 20 60 L 12 100 L -12 100 L -20 60 Z" />
        
        <!-- Chest Eagle Detailing -->
        <path class="suit-blue" d="M -18 20 L 18 20 L 22 35 L 0 55 L -22 35 Z" style="fill: #082d6d;" />
        <path class="suit-gold" d="M -18 20 L -10 30 L 0 25 L 10 30 L 18 20 L 22 25 L 0 45 L -22 25 Z" />
        
        <!-- Pauldrons -->
        <path class="suit-gold" d="M -18 20 C -30 10 -40 20 -30 35 C -25 25 -20 25 -18 20 Z" />
        <path class="suit-gold" d="M 18 20 C 30 10 40 20 30 35 C 25 25 20 25 18 20 Z" />
        
        <!-- Arms & Gloves (Straight down at sides) -->
        <path class="suit-blue" d="M -20 35 L -30 70 L -20 75 L -12 45 Z" />
        <path class="suit-blue" d="M 20 35 L 30 70 L 20 75 L 12 45 Z" />
        <path class="suit-red" d="M -30 70 L -35 90 L -15 90 L -20 75 Z" />
        <path class="suit-red" d="M 30 70 L 35 90 L 15 90 L 20 75 Z" />
        
        <!-- Belt -->
        <rect x="-14" y="95" width="28" height="8" class="suit-gold" rx="2" />
        
        <!-- Legs & Boots (Straight down, feet pointed slightly down) -->
        <path class="suit-blue" d="M -12 103 L -2 103 L -2 150 L -15 150 Z" />
        <path class="suit-blue" d="M 2 103 L 12 103 L 15 150 L 2 150 Z" />
        <path class="suit-red" d="M -15 135 L -2 135 L -2 175 L -15 180 L -20 175 Z" />
        <path class="suit-red" d="M 2 135 L 15 135 L 20 175 L 15 180 L 2 175 Z" />
        
        <!-- Head & Hair -->
        <!-- Looking forward, upright -->
        <path class="skin" d="M -10 -5 C -10 -15 10 -15 10 -5 L 8 15 C 3 18 -3 18 -8 15 Z" />
        <path class="skin" d="M -8 15 C -3 18 3 18 8 15 L 6 18 C 2 21 -2 21 -6 18 Z" style="fill: #e6b380;" />
        
        <path class="hair" d="M -12 -5 C -14 -25 14 -25 12 -5 C 8 -12 -8 -12 -12 -5 Z" />
        <path class="hair" d="M 0 -18 Q 15 -20 14 -5 Q 10 -15 0 -18 Z" style="fill: #f9d86c;" />
        
        <!-- Eyes -->
        <circle cx="-4" cy="4" r="2" class="eye" />
        <circle cx="4" cy="4" r="2" class="eye" />
        
        <!-- Dual Laser Beams -->
        <g class="laser-beam">
          <rect x="-4" y="3" width="900" height="2" fill="#FFF" />
          <rect x="-4" y="1" width="900" height="6" fill="#FF0000" opacity="0.8" filter="drop-shadow(0 0 10px #FF0000)" />
          <rect x="-4" y="-3" width="900" height="14" fill="#FF0000" opacity="0.4" filter="drop-shadow(0 0 20px #FF0000)" />
        </g>
        
      </g>
    </g>
  </g>
</svg>
