<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <style>
    .bg { fill: #050505; }
    
    .grid-line { stroke: #00F0FF; stroke-width: 0.5; opacity: 0.2; }
    
    .block { fill: rgba(0, 240, 255, 0.1); stroke: #00F0FF; stroke-width: 1; }
    .block-active { fill: rgba(0, 255, 102, 0.3); stroke: #00FF66; stroke-width: 1.5; animation: pulseBlock 2s infinite alternate; }
    .block-alert { fill: rgba(255, 0, 60, 0.3); stroke: #FF003C; stroke-width: 1.5; animation: alertBlock 1s infinite alternate; }
    
    @keyframes pulseBlock { to { fill: rgba(0, 255, 102, 0.6); transform: translate(-15px, -15px); } }
    @keyframes alertBlock { to { fill: rgba(255, 0, 60, 0.8); transform: translate(-25px, -25px); } }
    
    .data-stream { stroke: #B026FF; stroke-width: 2; stroke-dasharray: 10 30; animation: stream 1s linear infinite; }
    @keyframes stream { to { stroke-dashoffset: -40; } }

    .ui-text { fill: #00F0FF; font-family: monospace; font-size: 12px; font-weight: bold; transform: skewX(-10deg); }
    .title { fill: #E0E0E0; font-family: monospace; font-size: 16px; font-weight: bold; }
    
    .scanning-plane { fill: rgba(0, 240, 255, 0.15); animation: scanPlane 3s infinite ease-in-out alternate; }
    @keyframes scanPlane { 0% { transform: translateY(-120px); } 100% { transform: translateY(120px); } }
    
    .blinking { animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect width="800" height="400" class="bg" />
  
  <text x="30" y="40" class="title">QUANTUM_ISO_INTERFACE // DEPLOYED</text>
  <line x1="30" y1="50" x2="350" y2="50" stroke="#333" stroke-width="2" />
  
  <!-- Left Side: Readouts -->
  <g transform="translate(30, 80)">
    <text x="0" y="0" class="ui-text" style="fill: #888;">SERVER_RACK_01</text>
    <rect x="0" y="10" width="10" height="10" fill="#00FF66" />
    <text x="20" y="20" class="ui-text">NODE A - SECURE</text>
    
    <rect x="0" y="30" width="10" height="10" fill="#FF003C" class="blinking" />
    <text x="20" y="40" class="ui-text" style="fill: #FF003C;">NODE B - ALERT</text>
    
    <rect x="0" y="50" width="10" height="10" fill="#00F0FF" />
    <text x="20" y="60" class="ui-text">NODE C - SYNCING</text>
    
    <!-- CPU Graph -->
    <path d="M 0 120 L 20 100 L 40 110 L 60 70 L 80 90 L 100 50 L 120 80 L 140 40 L 160 60 L 160 120 Z" fill="rgba(0, 240, 255, 0.2)" stroke="#00F0FF" stroke-width="1" />
    <path d="M 0 120 L 20 100 L 40 110 L 60 70 L 80 90 L 100 50 L 120 80 L 140 40 L 160 60" fill="none" stroke="#00F0FF" stroke-width="2" />
    
    <text x="0" y="145" class="ui-text" style="fill: #888;">MEMORY_ALLOCATION_MATRIX</text>
    
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="20" height="20" fill="none" stroke="#B026FF" />
      <rect x="4" y="4" width="12" height="12" fill="#B026FF" class="blinking" />
      <text x="30" y="15" class="ui-text" style="fill: #B026FF;">HYPER_THREAD_ACTIVE</text>
    </g>
  </g>
  
  <!-- Right Side: The Isometric Deck -->
  <g transform="translate(550, 200)">
    <!-- Add some vertical projection lines to complete the 3D isometric look BEFORE drawing the grid so they are behind -->
    <path d="M 0 0 L 0 -100" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
    <path d="M -70 35 L -70 -65" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
    <path d="M 70 -35 L 70 -135" stroke="#FF003C" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />

    <!-- Base grid -->
    <g transform="scale(1, 0.5) rotate(45)">
      <!-- Grid lines -->
      <path class="grid-line" d="M -150 -150 L -150 150 M -100 -150 L -100 150 M -50 -150 L -50 150 M 0 -150 L 0 150 M 50 -150 L 50 150 M 100 -150 L 100 150 M 150 -150 L 150 150" />
      <path class="grid-line" d="M -150 -150 L 150 -150 M -150 -100 L 150 -100 M -150 -50 L 150 -50 M -150 0 L 150 0 M -150 50 L 150 50 M -150 100 L 150 100 M -150 150 L 150 150" />
      
      <!-- Blocks -->
      <rect x="-100" y="-100" width="40" height="40" class="block" />
      <rect x="-50" y="-100" width="40" height="40" class="block-active" style="animation-delay: 0.2s;" />
      <rect x="0" y="-100" width="40" height="40" class="block-alert" />
      
      <rect x="-100" y="-50" width="40" height="40" class="block" />
      <rect x="-50" y="-50" width="40" height="40" class="block-active" style="animation-delay: 0.6s;" />
      <rect x="0" y="-50" width="40" height="40" class="block" />
      
      <rect x="-100" y="0" width="40" height="40" class="block-active" style="animation-delay: 1.1s;" />
      <rect x="-50" y="0" width="40" height="40" class="block" />
      <rect x="0" y="0" width="40" height="40" class="block-alert" style="animation-delay: 0.8s;" />
      
      <!-- Data Streams flowing between blocks -->
      <line x1="-80" y1="-80" x2="-30" y2="-80" class="data-stream" />
      <line x1="-30" y1="-80" x2="-30" y2="-30" class="data-stream" style="stroke: #00FF66;" />
      <line x1="-30" y1="-30" x2="20" y2="-30" class="data-stream" />
      <line x1="20" y1="-30" x2="20" y2="20" class="data-stream" style="stroke: #FF003C;" />
      
      <!-- A moving scanning plane across the grid -->
      <rect x="-150" y="-20" width="300" height="40" class="scanning-plane" />
    </g>
    
    <!-- Floating Hexagons above the grid for extra 3D effect -->
    <g transform="translate(0, -100)">
       <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="none" stroke="#00F0FF" stroke-width="2" class="blinking" />
    </g>
    <g transform="translate(-70, -65)">
       <polygon points="0,-10 8.6,-5 8.6,5 0,10 -8.6,5 -8.6,-5" fill="none" stroke="#00FF66" stroke-width="2" />
    </g>
    <g transform="translate(70, -135)">
       <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="none" stroke="#FF003C" stroke-width="2" class="blinking" style="animation-duration: 0.5s;" />
    </g>
  </g>
</svg>
