<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <style>
    .bg { fill: #050505; }
    .matrix-drop { fill: #00FF66; font-family: monospace; font-size: 14px; opacity: 0; animation: fall 3s infinite linear; }
    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    .monolith { fill: #0a0a0a; stroke: #00F0FF; stroke-width: 2; }
    .monolith-side { fill: #050505; stroke: #00F0FF; stroke-width: 1; }
    .glow-core { fill: #00F0FF; animation: corePulse 2s infinite alternate; }
    @keyframes corePulse { from { filter: drop-shadow(0 0 5px #00F0FF); opacity: 0.7; } to { filter: drop-shadow(0 0 20px #00F0FF); opacity: 1; } }
    .data-ring { fill: none; stroke: #B026FF; stroke-width: 2; stroke-dasharray: 20 10; animation: spin-ring 5s linear infinite; transform-origin: 400px 200px; }
    @keyframes spin-ring { to { transform: rotateX(70deg) rotateZ(360deg); } }
  </style>
  <rect width="800" height="300" class="bg" />
  
  <!-- Matrix Rain -->
  <g opacity="0.3">
    <text x="100" y="0" class="matrix-drop" style="animation-delay: 0.1s;">1 0 1 1 0 1</text>
    <text x="250" y="0" class="matrix-drop" style="animation-delay: 1.5s;">0 1 0 0 1</text>
    <text x="550" y="0" class="matrix-drop" style="animation-delay: 0.8s;">1 1 1 0 0</text>
    <text x="700" y="0" class="matrix-drop" style="animation-delay: 2.1s;">0 0 1 1 1</text>
    <text x="200" y="0" class="matrix-drop" style="animation-delay: 0.4s;">1 0 0 1 0 1</text>
    <text x="600" y="0" class="matrix-drop" style="animation-delay: 1.2s; fill: #B026FF;">0 1 1 1 0</text>
  </g>
  
  <!-- Spinning 3D Rings at Base -->
  <g transform="perspective(500) rotateX(70deg)">
    <circle cx="400" cy="200" r="100" class="data-ring" />
    <circle cx="400" cy="200" r="120" class="data-ring" style="stroke: #00F0FF; animation-direction: reverse; animation-duration: 8s;" />
  </g>
  
  <!-- Monolith (Vector DB) -->
  <g transform="translate(360, 50)">
    <!-- Right side -->
    <polygon points="40,20 60,10 60,160 40,180" class="monolith-side" />
    <!-- Front side -->
    <polygon points="0,0 40,20 40,180 0,160" class="monolith" />
    <!-- Top side -->
    <polygon points="0,0 20,-10 60,10 40,20" class="monolith-side" />
    
    <!-- Glowing internal data slots -->
    <line x1="10" y1="30" x2="30" y2="40" stroke="#00F0FF" stroke-width="3" class="glow-core" />
    <line x1="10" y1="60" x2="30" y2="70" stroke="#00FF66" stroke-width="3" class="glow-core" style="animation-delay: 0.5s;" />
    <line x1="10" y1="90" x2="30" y2="100" stroke="#00F0FF" stroke-width="3" class="glow-core" style="animation-delay: 1s;" />
    <line x1="10" y1="120" x2="30" y2="130" stroke="#B026FF" stroke-width="3" class="glow-core" style="animation-delay: 1.5s;" />
  </g>
</svg>
