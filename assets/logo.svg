<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="200">
  <style>
    .bg { fill: transparent; }
    .outer { fill: none; stroke: #00F0FF; stroke-width: 4; stroke-dasharray: 20 10; animation: spin 10s linear infinite; transform-origin: center; }
    .inner { fill: none; stroke: #B026FF; stroke-width: 4; stroke-dasharray: 15 15; animation: spin-reverse 8s linear infinite; transform-origin: center; }
    .text { fill: #E0E0E0; font-family: monospace; font-size: 24px; font-weight: bold; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
  </style>
  <rect width="200" height="200" class="bg" />
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="80" class="outer" />
    <circle cx="0" cy="0" r="60" class="inner" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00FF66" stroke-width="2" />
    <text x="0" y="8" class="text" text-anchor="middle">AI</text>
  </g>
</svg>
