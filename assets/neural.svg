<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <style>
    .bg { fill: #050505; }
    .synapse { stroke: #B026FF; stroke-width: 1.5; opacity: 0.4; }
    .synapse-active { stroke: #00F0FF; stroke-width: 2; animation: flash 2s infinite; }
    .neuron { fill: #00FF66; filter: drop-shadow(0 0 4px #00FF66); }
    @keyframes flash { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #00F0FF); } }
  </style>
  <rect width="800" height="200" class="bg" />
  <g transform="translate(100, 100)">
    <!-- Add some network paths -->
    <path d="M 0 0 Q 150 -80 300 0 T 600 0" class="synapse" fill="none" />
    <path d="M 0 0 Q 150 80 300 0 T 600 0" class="synapse-active" fill="none" />
    <circle cx="0" cy="0" r="4" class="neuron" />
    <circle cx="150" cy="-40" r="3" class="neuron" />
    <circle cx="150" cy="40" r="3" class="neuron" />
    <circle cx="300" cy="0" r="5" class="neuron" />
    <circle cx="450" cy="-40" r="3" class="neuron" />
    <circle cx="450" cy="40" r="3" class="neuron" />
    <circle cx="600" cy="0" r="4" class="neuron" />
  </g>
</svg>
