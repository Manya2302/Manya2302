<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="300">
  <style>
    .bg { fill: #050505; }
    .radar-grid { fill: none; stroke: #00F0FF; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    .radar-sweep { fill: #00F0FF; transform-origin: 150px 150px; animation: sweep 4s linear infinite; opacity: 0.2; }
    .blip { fill: #00FF66; opacity: 0; animation: blip 4s infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes blip { 0%, 10% { opacity: 0; } 15%, 30% { opacity: 1; filter: drop-shadow(0 0 5px #00FF66); } 100% { opacity: 0; } }
  </style>
  <rect width="300" height="300" class="bg" />
  <circle cx="150" cy="150" r="100" class="radar-grid" />
  <circle cx="150" cy="150" r="66" class="radar-grid" />
  <circle cx="150" cy="150" r="33" class="radar-grid" />
  <line x1="150" y1="50" x2="150" y2="250" stroke="#00F0FF" stroke-width="0.5" opacity="0.3" />
  <line x1="50" y1="150" x2="250" y2="150" stroke="#00F0FF" stroke-width="0.5" opacity="0.3" />
  
  <path d="M 150 150 L 150 50 A 100 100 0 0 1 250 150 Z" class="radar-sweep" />
  
  <circle cx="200" cy="100" r="4" class="blip" style="animation-delay: 0.5s;" />
  <circle cx="110" cy="200" r="3" class="blip" style="animation-delay: 2.2s; fill: #B026FF;" />
</svg>
