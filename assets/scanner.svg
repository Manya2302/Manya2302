<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <style>
    .bg { fill: #050505; }
    .laser { fill: url(#laserGrad); animation: sweep 3s ease-in-out infinite alternate; }
    @keyframes sweep { 0% { transform: translateX(-100px); } 100% { transform: translateX(800px); } }
    .grid { stroke: #00F0FF; stroke-width: 0.5; opacity: 0.2; }
  </style>
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="100" class="bg" />
  
  <line x1="0" y1="25" x2="800" y2="25" class="grid" />
  <line x1="0" y1="50" x2="800" y2="50" class="grid" />
  <line x1="0" y1="75" x2="800" y2="75" class="grid" />
  
  <rect x="0" y="0" width="100" height="100" class="laser" />
  <text x="350" y="55" font-family="monospace" fill="#00F0FF" font-size="12" letter-spacing="4">SCANNING MODULES...</text>
</svg>
