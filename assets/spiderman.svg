<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <style>
    .bg { fill: #050505; }
    
    .spiderman-container {
      animation: animar 19s infinite linear;
    }
    
    /* 
      19s total duration.
      0s to 15s (78.9%): Hidden above screen.
      15s to 17s (89.4%): Drops down into view.
      17s to 19s (100%): Pulls back up out of view.
    */
    @keyframes animar {
      0%, 78.9% { transform: translateY(-400px); }
      89.4% { transform: translateY(-30px); }
      100% { transform: translateY(-400px); }
    }
    
    .glow-text {
      font-family: monospace; 
      font-size: 52px; 
      font-weight: bold; 
      fill: #00F0FF; 
      text-anchor: middle; 
      filter: drop-shadow(0px 0px 8px #00F0FF);
    }
  </style>
  <rect width="1000" height="250" class="bg" />
  
  <!-- Background Text -->
  <text x="500" y="140" class="glow-text">MANYA // AI ENGINEER ⬡</text>

  <!-- High Quality Spiderman Image Hanging Down -->
  <g class="spiderman-container">
    <line x1="500" y1="-500" x2="500" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <image href="https://i.ibb.co/XDFkXMx/spiderman-colgado.png" x="350" y="20" width="300" height="250" />
  </g>
</svg>
