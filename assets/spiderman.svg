<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <style>
    .bg { fill: #050505; }
    
    .swing-container { 
      transform-origin: 0px -200px;
      animation: swing 10s ease-in-out infinite alternate;
    }
    @keyframes swing {
      0% { transform: rotate(-40deg); }
      100% { transform: rotate(40deg); }
    }
    
    .web-line { stroke: #FFF; stroke-width: 1.5; opacity: 0.8; }
    
    /* Spidey simple shapes */
    .suit-red { fill: #D92525; }
    .suit-blue { fill: #0B3C5D; }
    .eye-white { fill: #FFF; }
    .eye-black { fill: #000; }
  </style>
  <rect width="1000" height="200" class="bg" />
  
  <!-- Spiderman swinging in background -->
  <g class="swing-container">
    <line x1="0" y1="-200" x2="500" y2="100" class="web-line" />
    <g transform="translate(500, 100) rotate(15) scale(0.9)">
      <!-- Body -->
      <path d="M-15,-20 C-30,-20 -30,20 -15,40 C-5,50 5,50 15,40 C30,20 30,-20 15,-20 Z" class="suit-blue" />
      <path d="M-10,-20 C-20,-20 -20,10 -10,20 C0,25 0,25 10,20 C20,10 20,-20 10,-20 Z" class="suit-red" />
      <!-- Head -->
      <ellipse cx="0" cy="-35" rx="15" ry="18" class="suit-red" />
      <!-- Eyes -->
      <path d="M-2,-35 C-8,-38 -12,-35 -14,-30 C-10,-30 -5,-32 -2,-35 Z" class="eye-black" />
      <path d="M-3,-34.5 C-7,-37 -10,-35 -12,-31 C-9,-31 -5,-33 -3,-34.5 Z" class="eye-white" />
      <path d="M2,-35 C8,-38 12,-35 14,-30 C10,-30 5,-32 2,-35 Z" class="eye-black" />
      <path d="M3,-34.5 C7,-37 10,-35 12,-31 C9,-31 5,-33 3,-34.5 Z" class="eye-white" />
      <!-- Arms -->
      <path d="M-15,-15 L-30,-40 L-25,-45 L-10,-20 Z" class="suit-red" /> <!-- Left holding web -->
      <path d="M15,-15 L35,-10 L30,-5 L15,-10 Z" class="suit-red" /> <!-- Right out -->
      <!-- Legs -->
      <path d="M-10,35 L-20,60 L-15,65 L-5,40 Z" class="suit-blue" />
      <path d="M-20,60 L-25,75 L-15,75 L-15,65 Z" class="suit-red" />
      <path d="M10,35 L20,60 L15,65 L5,40 Z" class="suit-blue" />
      <path d="M20,60 L25,75 L15,75 L15,65 Z" class="suit-red" />
    </g>
  </g>
  
  <!-- Foreground Text -->
  <text x="500" y="115" font-family="monospace" font-size="48" font-weight="bold" fill="#00F0FF" text-anchor="middle" filter="drop-shadow(0px 0px 8px #000)">MANYA // AI ENGINEER ⬡</text>
</svg>
