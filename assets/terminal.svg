<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200">
  <style>
    .bg { fill: #0A0A0A; stroke: #333; stroke-width: 2; rx: 5; }
    .header { fill: #1A1A1A; }
    .text { font-family: monospace; font-size: 12px; fill: #E0E0E0; }
    .prompt { fill: #B026FF; font-weight: bold; }
    .cmd { fill: #00FF66; }
    .output { fill: #888; }
    .blink { animation: blink 1s infinite; fill: #00F0FF; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect x="5" y="5" width="590" height="190" class="bg" />
  <rect x="5" y="5" width="590" height="25" class="header" />
  <circle cx="20" cy="17" r="5" fill="#FF5F56" />
  <circle cx="40" cy="17" r="5" fill="#FFBD2E" />
  <circle cx="60" cy="17" r="5" fill="#27C93F" />
  <text x="300" y="20" class="text" text-anchor="middle" fill="#888">DEPLOYMENT_LOG.sh</text>
  
  <text x="20" y="55" class="text prompt">manya@ai-core:~$</text>
  <text x="140" y="55" class="text cmd">tail -f /var/log/neural.log</text>
  
  <text x="20" y="80" class="text output">[10:04:21] Model weights loaded successfully.</text>
  <text x="20" y="100" class="text output">[10:04:22] Vector DB connection established.</text>
  <text x="20" y="120" class="text output">[10:04:25] Agents syncing... OK.</text>
  <text x="20" y="140" class="text output">[10:04:26] Listening on port 8080.</text>
  
  <text x="20" y="170" class="text prompt">manya@ai-core:~$</text>
  <rect x="140" y="160" width="8" height="12" class="blink" />
</svg>
